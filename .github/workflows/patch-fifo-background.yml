name: FIFO inventory and background actions

on:
  push:
    paths:
      - '.github/workflows/patch-fifo-background.yml'
      - 'tools/patch_fifo.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 tools/patch_fifo.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Code.gs App.html
          git diff --cached --quiet || git commit -m 'Agregar FIFO por lotes y acciones en segundo plano'
          git push
