name: Background save actions

on:
  push:
    paths:
      - '.github/workflows/patch-background-saves.yml'
      - 'tools/patch_background_saves.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/patch_background_saves.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add App.html
          git diff --cached --quiet || git commit -m 'Aplicar guardados en segundo plano con spinner'
          git push
