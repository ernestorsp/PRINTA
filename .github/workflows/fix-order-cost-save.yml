name: Fix order cost saving

on:
  push:
    paths:
      - 'tools/fix_order_cost_save.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch App.html
        run: python3 tools/fix_order_cost_save.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add App.html
          git commit -m 'Guardar correctamente tinta materiales y costos de la orden'
          git push
