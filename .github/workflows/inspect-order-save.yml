name: Inspect order save
on:
  push:
    paths:
      - '.github/workflows/inspect-order-save.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('App.html').read_text(encoding='utf-8')
          names=['saveOrderClient','recalculateOrder','syncMainProduct','addMaterialRow','editOrder']
          out=[]
          for name in names:
              m=re.search(r'function '+name+r'\([^)]*\)\{',s)
              if not m:
                  out.append('\n=== '+name+' NOT FOUND ===\n');continue
              start=m.start(); i=m.end(); depth=1; quote=None; esc=False
              while i<len(s) and depth:
                  c=s[i]
                  if quote:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: quote=None
                  else:
                      if c in "'\"`": quote=c
                      elif c=='{': depth+=1
                      elif c=='}': depth-=1
                  i+=1
              out.append('\n=== '+name+' ===\n'+s[start:i]+'\n')
          Path('ORDER_SAVE_DEBUG.txt').write_text(''.join(out),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ORDER_SAVE_DEBUG.txt
          git commit -m 'Inspeccionar guardado de costos de orden'
          git push
