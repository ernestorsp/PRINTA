<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--pink:#ff2f92;--purple:#7c3aed;--blue:#1da1f2;--green:#198754;--yellow:#f59e0b;--red:#dc2626;--ink:#20202d;--muted:#737386;--line:#e7e7ef;--bg:#f5f6fb;--shadow:0 12px 30px #20233b14}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}header{position:sticky;top:0;z-index:10;background:#fffffff2;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.head{max-width:1180px;margin:auto;padding:10px 18px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px}.logo{width:54px;height:54px;object-fit:contain}.sub{font-size:12px;color:var(--muted)}h1,h2,h3{margin:0}.wrap{max-width:1180px;margin:auto;padding:22px 18px 40px}.tabs,.actions,.toolbar{display:flex;gap:8px;flex-wrap:wrap}.tabs{background:#fff;padding:7px;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:20px}.btn,.tabs button{border:0;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer}.tabs button,.btn.light{background:#eef0f5}.tabs button.active,.btn.primary{color:#fff;background:linear-gradient(135deg,var(--purple),var(--pink))}.btn.good{background:#e7f8ee;color:#166534}.btn.danger{background:#feecec;color:#a51d1d}.toolbar{justify-content:space-between;align-items:center;margin:20px 0 14px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.orders,.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow)}.metric{border-left:5px solid var(--purple)}.metric small{color:var(--muted);font-weight:700}.metric strong{display:block;font-size:27px;margin-top:6px}.section{display:none}.section.active{display:block}.order{border-left:6px solid var(--green)}.order.yellow{border-left-color:var(--yellow)}.order.red{border-left-color:var(--red)}.order.gray{border-left-color:#9ca3af}.top{display:flex;justify-content:space-between;gap:10px}.badge{padding:5px 10px;border-radius:999px;font-size:12px;font-weight:900;background:#fff4cc;color:#8a5800}.badge.ready{background:#dcfce7;color:#166534}.origin{font-size:12px;color:var(--muted);font-weight:800}.order h3{margin:12px 0 6px}.order p{margin:6px 0}.deadline{display:inline-block;padding:7px 10px;border-radius:10px;font-weight:900;background:#eaf8ef;color:#166534;margin-top:7px}.yellow .deadline{background:#fff4d6;color:#9a5a00}.red .deadline{background:#fee8e8;color:#b42318}.gray .deadline{background:#f1f2f5;color:#60606f}.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:0 0 12px}.gallery img{width:100%;height:90px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:pointer}.product-row{display:flex;gap:14px;align-items:center}.product-img{width:82px;height:82px;object-fit:cover;border-radius:14px}.legend{font-size:12px;color:var(--muted)}.modal{position:fixed;inset:0;background:#13142099;display:none;align-items:center;justify-content:center;padding:18px;z-index:30;backdrop-filter:blur(5px)}.modal.show{display:flex}.panel{background:#fff;border-radius:24px;padding:24px;width:min(820px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 70px #10112347}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.x{border:0;border-radius:50%;width:38px;height:38px;font-size:22px;cursor:pointer}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:900;margin-bottom:6px}input,select,textarea{width:100%;padding:12px 13px;border:1px solid #d8d9e2;border-radius:12px;font:inherit}textarea{min-height:105px}.hint{font-size:12px;color:var(--muted);margin-top:6px}.empty{text-align:center;color:var(--muted);padding:34px}.error{display:none;background:#feecec;color:#9f1f1f;padding:11px;border-radius:10px;margin-bottom:12px}.loading{opacity:.55;pointer-events:none}.selected-count{margin-top:7px;font-size:13px;font-weight:700;color:var(--purple)}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.orders,.products,.form{grid-template-columns:1fr}.full{grid-column:auto}.gallery{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header><div class="head"><div class="brand"><img class="logo" src="<?!= getLogoDataUrl() ?>"><div><h1>PRINTA</h1><div class="sub">Órdenes y finanzas de Printa Crea</div></div></div><button class="btn primary" onclick="openOrder()">+ Nueva orden</button></div></header>
<div class="wrap">
<div class="tabs"><button class="active" onclick="showTab('inicio',this)">Inicio</button><button onclick="showTab('ordenes',this)">Órdenes</button><button onclick="showTab('finanzas',this)">Finanzas</button><button onclick="showTab('productos',this)">Productos</button></div>
<section id="inicio" class="section active"><div class="grid" id="metrics"></div><div class="toolbar"><h2>Órdenes pendientes</h2><div class="legend">Verde: tiempo suficiente · Amarillo: 1–2 días · Rojo: hoy o vencida</div></div><div class="orders" id="pendingPreview"></div></section>
<section id="ordenes" class="section"><div class="toolbar"><div><button class="btn light" onclick="orderFilter='Pendiente';orders()">Pendientes</button><button class="btn light" onclick="orderFilter='Listo';orders()">Listas</button><button class="btn light" onclick="orderFilter='Todos';orders()">Todas</button></div><button class="btn primary" onclick="openOrder()">+ Nueva orden</button></div><div class="orders" id="ordersList"></div></section>
<section id="finanzas" class="section"><div class="grid" id="financeMetrics"></div><div class="toolbar"><h2>Gastos</h2><button class="btn primary" onclick="openExpense()">+ Nuevo gasto</button></div><div id="expensesList"></div></section>
<section id="productos" class="section"><div class="toolbar"><h2>Catálogo de productos</h2><button class="btn primary" onclick="openProduct()">+ Nuevo producto</button></div><div class="products" id="productsList"></div></section>
</div>
<div id="orderModal" class="modal"><div class="panel"><div class="panel-head"><h2 id="orderTitle">Nueva orden</h2><button class="x" onclick="closeModal('orderModal')">×</button></div><div id="orderError" class="error"></div><form id="orderForm" class="form" onsubmit="submitOrder(event)"><input type="hidden" name="id"><input type="hidden" name="creadoEn"><input type="hidden" name="foto"><div><label>Fecha de la orden</label><input type="date" name="fecha" required onchange="updateShippingDate()"></div><div><label>Origen</label><select name="origen" onchange="updateShippingDate()"><option>TikTok</option><option>Printa Crea</option><option>Otro</option></select></div><div><label>Cliente</label><input name="cliente" required></div><div><label>Producto</label><select name="producto" id="productSelect" required></select></div><div><label>Cantidad</label><input type="number" min="1" name="cantidad" value="1"></div><div><label>Precio pagado</label><input type="number" step="0.01" min="0" name="pagado" value="0"></div><div class="full"><label>Fecha límite de envío</label><input type="date" name="fechaEnvio" readonly><div class="hint" id="shippingHint"></div></div><div class="full"><label>Notas</label><textarea name="notas"></textarea></div><div class="full"><label>Fotos de la orden o referencias</label><input type="file" id="orderFiles" accept="image/*" multiple onchange="showSelectedCount()"><div id="selectedCount" class="selected-count">Puedes seleccionar varias fotos a la vez.</div></div><div class="full actions"><button class="btn primary">Guardar</button><button class="btn light" type="button" onclick="closeModal('orderModal')">Cancelar</button></div></form></div></div>
<div id="expenseModal" class="modal"><div class="panel"><div class="panel-head"><h2>Nuevo gasto</h2><button class="x" onclick="closeModal('expenseModal')">×</button></div><div id="expenseError" class="error"></div><form id="expenseForm" class="form" onsubmit="submitExpense(event)"><div><label>Fecha</label><input type="date" name="fecha" required></div><div><label>Cantidad</label><input type="number" step="0.01" min="0.01" name="cantidad" required></div><div><label>Categoría</label><select name="categoria"><option>Productos</option><option>Materiales</option><option>Tinta</option><option>Papel</option><option>Empaque</option><option>Envíos</option><option>Publicidad</option><option>Suscripciones</option><option>Equipos</option><option>Otro</option></select></div><div><label>Lugar</label><input name="lugar"></div><div class="full"><label>Nota</label><textarea name="nota"></textarea></div><div class="full"><label>Foto del recibo</label><input type="file" id="receiptFile" accept="image/*"><input type="hidden" name="recibo"></div><div class="full actions"><button class="btn primary">Guardar gasto</button><button class="btn light" type="button" onclick="closeModal('expenseModal')">Cancelar</button></div></form></div></div>
<div id="productModal" class="modal"><div class="panel"><div class="panel-head"><h2 id="productTitle">Nuevo producto</h2><button class="x" onclick="closeModal('productModal')">×</button></div><div id="productError" class="error"></div><form id="productForm" class="form" onsubmit="submitProduct(event)"><input type="hidden" name="id"><input type="hidden" name="creadoEn"><div class="full"><label>Nombre</label><input name="nombre" required></div><div><label>Disponible</label><select name="disponible"><option value="true">Sí</option><option value="false">No</option></select></div><div><label>Foto</label><input type="file" id="productImage" accept="image/*"><input type="hidden" name="foto"></div><div class="full actions"><button class="btn primary">Guardar producto</button><button class="btn light" type="button" onclick="closeModal('productModal')">Cancelar</button></div></form></div></div>
<script>
let data={orders:[],expenses:[],products:[],settings:{tiktokDays:2,printaDays:3},summary:{}},orderFilter='Pendiente';const $=s=>document.querySelector(s),money=v=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(v||0));
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function load(){document.body.classList.add('loading');google.script.run.withSuccessHandler(d=>{data=d;render();document.body.classList.remove('loading')}).withFailureHandler(showGlobalError).getAppData()}
function render(){metrics();orders();preview();expenses();products();productSelect()}
function metrics(){const s=data.summary||{};$('#metrics').innerHTML=[['Pendientes',s.pendientes],['Listas',s.listos],['Ingresos',money(s.ingresos)],['Gastos',money(s.gastos)],['Ganancia',money(s.ganancia)]].map(x=>`<div class="card metric"><small>${x[0]}</small><strong>${x[1]??0}</strong></div>`).join('');$('#financeMetrics').innerHTML=[['Ingresos',money(s.ingresos)],['Gastos',money(s.gastos)],['Ganancia',money(s.ganancia)],['TikTok',money(s.tiktok)],['Printa Crea',money(s.printaCrea)]].map(x=>`<div class="card metric"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}
function dateObj(s){if(!s)return null;const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)}function days(s){const a=dateObj(today()),b=dateObj(s);return b?Math.ceil((b-a)/86400000):999}function color(o){if(o.estado==='Listo')return'gray';const n=days(o.fechaEnvio);return n<=0?'red':n<=2?'yellow':''}function due(o){if(o.estado==='Listo')return'Orden lista';const n=days(o.fechaEnvio);if(n<0)return`Vencida hace ${Math.abs(n)} día${Math.abs(n)==1?'':'s'}`;if(n===0)return'Vence hoy';if(n===1)return'Vence mañana';return`Faltan ${n} días`}
function photoUrls(v){return String(v||'').split('|||').map(x=>x.trim()).filter(Boolean)}function gallery(v){const a=photoUrls(v);return a.length?`<div class="gallery">${a.map(u=>`<img src="${u}" onclick="window.open('${u}','_blank')">`).join('')}</div>`:''}
function card(o){return`<div class="card order ${color(o)}">${gallery(o.foto)}<div class="top"><span class="badge ${o.estado==='Listo'?'ready':''}">${esc(o.estado)}</span><span class="origin">${esc(o.origen)}</span></div><h3>${esc(o.cliente)}</h3><p><b>${esc(o.producto)}</b> × ${esc(o.cantidad)}</p><p>Pagado: <b>${money(o.pagado)}</b></p><div class="deadline">${due(o)} · ${esc(o.fechaEnvio||'')}</div>${o.notas?`<p>${esc(o.notas)}</p>`:''}<div class="actions"><button class="btn good" onclick="status('${o.id}','${o.estado==='Listo'?'Pendiente':'Listo'}')">${o.estado==='Listo'?'Regresar a pendiente':'Marcar listo'}</button><button class="btn light" onclick="editOrder('${o.id}')">Editar</button><button class="btn danger" onclick="removeOrder('${o.id}')">Eliminar</button></div></div>`}
function orders(){const r=data.orders.filter(o=>orderFilter==='Todos'||o.estado===orderFilter).reverse();$('#ordersList').innerHTML=r.length?r.map(card).join(''):'<div class="card empty">No hay órdenes.</div>'}function preview(){const r=data.orders.filter(o=>o.estado==='Pendiente').slice(-4).reverse();$('#pendingPreview').innerHTML=r.length?r.map(card).join(''):'<div class="card empty">No hay órdenes pendientes.</div>'}
function expenses(){const r=[...data.expenses].reverse();$('#expensesList').innerHTML=r.length?r.map(e=>`<div class="card" style="margin-bottom:10px"><b>${esc(e.categoria)}</b> · ${money(e.cantidad)}<p>${esc(e.nota||'')}</p><div class="actions"><button class="btn danger" onclick="removeExpense('${e.id}')">Eliminar</button></div></div>`).join(''):'<div class="card empty">No hay gastos.</div>'}
function products(){const r=[...data.products].reverse();$('#productsList').innerHTML=r.length?r.map(p=>`<div class="card"><div class="product-row">${p.foto?`<img class="product-img" src="${p.foto}">`:''}<div><h3>${esc(p.nombre)}</h3><span class="badge ready">${String(p.disponible).toLowerCase()==='true'?'Disponible':'No disponible'}</span></div></div><div class="actions"><button class="btn light" onclick="editProduct('${p.id}')">Editar</button><button class="btn danger" onclick="removeProduct('${p.id}')">Eliminar</button></div></div>`).join(''):'<div class="card empty">No hay productos.</div>'}function productSelect(){const r=data.products.filter(p=>String(p.disponible).toLowerCase()==='true');$('#productSelect').innerHTML=r.length?r.map(p=>`<option>${esc(p.nombre)}</option>`).join(''):'<option value="">Agrega un producto primero</option>'}
function addBusinessDays(s,n){const d=dateObj(s);let a=0;while(a<n){d.setDate(d.getDate()+1);if(d.getDay()!=0&&d.getDay()!=6)a++}return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function updateShippingDate(){const f=$('#orderForm'),n=f.origen.value==='TikTok'?Number(data.settings.tiktokDays||2):Number(data.settings.printaDays||3);f.fechaEnvio.value=addBusinessDays(f.fecha.value||today(),n);$('#shippingHint').textContent=`${n} días laborables para ${f.origen.value==='TikTok'?'TikTok Shop':'Printa Crea'}.`}
function openOrder(){const f=$('#orderForm');f.reset();f.fecha.value=today();f.cantidad.value=1;f.pagado.value=0;f.foto.value='';$('#orderFiles').value='';showSelectedCount();$('#orderTitle').textContent='Nueva orden';productSelect();updateShippingDate();showModal('orderModal')}function editOrder(id){const o=data.orders.find(x=>x.id===id);if(!o)return;openOrder();$('#orderTitle').textContent='Editar orden '+id;Object.keys(o).forEach(k=>{if($('#orderForm')[k])$('#orderForm')[k].value=o[k]||''});updateShippingDate()}function openExpense(){const f=$('#expenseForm');f.reset();f.fecha.value=today();showModal('expenseModal')}function openProduct(){const f=$('#productForm');f.reset();$('#productTitle').textContent='Nuevo producto';showModal('productModal')}function editProduct(id){const p=data.products.find(x=>x.id===id);if(!p)return;openProduct();$('#productTitle').textContent='Editar producto';Object.keys(p).forEach(k=>{if($('#productForm')[k])$('#productForm')[k].value=p[k]||''})}
function showSelectedCount(){const n=$('#orderFiles').files.length;$('#selectedCount').textContent=n?`${n} foto${n===1?'':'s'} seleccionada${n===1?'':'s'}.`:'Puedes seleccionar varias fotos a la vez.'}
async function submitOrder(e){e.preventDefault();const f=e.target;busy(f,true);try{const o=Object.fromEntries(new FormData(f).entries()),old=photoUrls(o.foto),fresh=[];for(const file of $('#orderFiles').files)fresh.push(await upload(file,o.id||'NUEVA','orden'));o.foto=[...old,...fresh].join('|||');run('saveOrder',o,d=>done(d,'orderModal',f),er=>fail('orderError',er,f))}catch(er){fail('orderError',er,f)}}
async function submitExpense(e){e.preventDefault();const f=e.target;busy(f,true);try{const o=Object.fromEntries(new FormData(f).entries());if($('#receiptFile').files[0])o.recibo=await upload($('#receiptFile').files[0],'GASTO','recibo');run('saveExpense',o,d=>done(d,'expenseModal',f),er=>fail('expenseError',er,f))}catch(er){fail('expenseError',er,f)}}async function submitProduct(e){e.preventDefault();const f=e.target;busy(f,true);try{const o=Object.fromEntries(new FormData(f).entries());if($('#productImage').files[0])o.foto=await upload($('#productImage').files[0],o.id||'PRODUCTO','producto');run('saveProduct',o,d=>done(d,'productModal',f),er=>fail('productError',er,f))}catch(er){fail('productError',er,f)}}
function upload(file,id,cat){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).uploadFile(r.result,file.name,file.type,id,cat);r.onerror=reject;r.readAsDataURL(file)})}function run(fn,arg,ok,er){google.script.run.withSuccessHandler(ok).withFailureHandler(er)[fn](arg)}function done(d,m,f){data=d;render();closeModal(m);busy(f,false)}function fail(id,e,f){const x=$('#'+id);x.textContent=e.message||e;x.style.display='block';busy(f,false)}function busy(f,v){f.querySelectorAll('button,input,select,textarea').forEach(x=>x.disabled=v)}
function status(id,s){google.script.run.withSuccessHandler(d=>{data=d;render()}).setOrderStatus(id,s)}function removeOrder(id){if(confirm('¿Eliminar esta orden?'))google.script.run.withSuccessHandler(d=>{data=d;render()}).deleteOrder(id)}function removeExpense(id){if(confirm('¿Eliminar este gasto?'))google.script.run.withSuccessHandler(d=>{data=d;render()}).deleteExpense(id)}function removeProduct(id){if(confirm('¿Eliminar este producto?'))google.script.run.withSuccessHandler(d=>{data=d;render()}).deleteProduct(id)}function showTab(id,b){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));$('#'+id).classList.add('active');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active')}function showModal(id){$('#'+id).classList.add('show')}function closeModal(id){$('#'+id).classList.remove('show')}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function showGlobalError(e){alert(e.message||e);document.body.classList.remove('loading')}window.onload=load;
</script>
</body></html>
