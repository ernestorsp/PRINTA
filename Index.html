<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{--bg:#f6f7fb;--card:#fff;--ink:#18181b;--muted:#71717a;--dark:#111827;--line:#e4e4e7;--green:#166534;--red:#991b1b}
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:22px}.wrap{max-width:1100px;margin:auto;padding:18px}.tabs,.actions,.toolbar{display:flex;gap:8px;flex-wrap:wrap}.tabs{margin-bottom:16px}.toolbar{justify-content:space-between;align-items:center;margin:18px 0}.btn,.tabs button{border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer}.tabs button,.btn.light{background:#e4e4e7}.tabs button.active,.btn.primary{background:var(--dark);color:#fff}.btn.good{background:#dcfce7;color:var(--green)}.btn.danger{background:#fee2e2;color:var(--red)}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.orders,.products{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px}.metric small{color:var(--muted)}.metric strong{display:block;font-size:24px;margin-top:5px}.section{display:none}.section.active{display:block}.badge{display:inline-block;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700;background:#fef3c7;color:#92400e}.badge.ready{background:#dcfce7;color:var(--green)}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modal.show{display:flex}.panel{background:#fff;border-radius:16px;padding:20px;width:min(760px,100%);max-height:92vh;overflow:auto}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}input,select,textarea{width:100%;padding:11px;border:1px solid #d4d4d8;border-radius:9px;font:inherit}textarea{min-height:90px}.hint{font-size:12px;color:var(--muted);margin-top:5px}.empty{text-align:center;color:var(--muted);padding:30px}.error{display:none;background:#fee2e2;color:var(--red);padding:10px;border-radius:8px;margin-bottom:10px}.loading{opacity:.55;pointer-events:none}.product-img{width:70px;height:70px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.orders,.products,.form{grid-template-columns:1fr}.full{grid-column:auto}}
  </style>
</head>
<body>
<header><h1>PRINTA</h1><button class="btn primary" onclick="openOrder()">+ Nueva orden</button></header>
<div class="wrap">
  <div class="tabs"><button class="active" onclick="showTab('inicio',this)">Inicio</button><button onclick="showTab('ordenes',this)">Órdenes</button><button onclick="showTab('finanzas',this)">Finanzas</button><button onclick="showTab('productos',this)">Productos</button></div>
  <section id="inicio" class="section active"><div class="grid" id="metrics"></div><div class="toolbar"><h2>Órdenes pendientes</h2></div><div class="orders" id="pendingPreview"></div></section>
  <section id="ordenes" class="section"><div class="toolbar"><div><button class="btn light" onclick="orderFilter='Pendiente';renderOrders()">Pendientes</button><button class="btn light" onclick="orderFilter='Listo';renderOrders()">Listas</button><button class="btn light" onclick="orderFilter='Todos';renderOrders()">Todas</button></div><button class="btn primary" onclick="openOrder()">+ Nueva orden</button></div><div class="orders" id="ordersList"></div></section>
  <section id="finanzas" class="section"><div class="grid" id="financeMetrics"></div><div class="toolbar"><h2>Gastos</h2><button class="btn primary" onclick="openExpense()">+ Nuevo gasto</button></div><div id="expensesList"></div></section>
  <section id="productos" class="section"><div class="toolbar"><h2>Catálogo</h2><button class="btn primary" onclick="openProduct()">+ Nuevo producto</button></div><div class="products" id="productsList"></div></section>
</div>
<div id="orderModal" class="modal"><div class="panel"><h2 id="orderTitle">Nueva orden</h2><div id="orderError" class="error"></div><form id="orderForm" class="form" onsubmit="submitOrder(event)"><input type="hidden" name="id"><input type="hidden" name="creadoEn"><div><label>Fecha de la orden</label><input type="date" name="fecha" required onchange="updateShippingDate()"></div><div><label>Origen</label><select name="origen" onchange="updateShippingDate()"><option>TikTok</option><option>Printa Crea</option><option>Otro</option></select></div><div><label>Cliente</label><input name="cliente" required></div><div><label>Producto</label><select name="producto" id="productSelect" required></select></div><div><label>Cantidad</label><input type="number" min="1" name="cantidad" value="1"></div><div><label>Precio pagado</label><input type="number" step="0.01" min="0" name="pagado" value="0"></div><div class="full"><label>Fecha límite de envío</label><input type="date" name="fechaEnvio" readonly><div class="hint" id="shippingHint"></div></div><div class="full"><label>Notas</label><textarea name="notas"></textarea></div><div class="full"><label>Foto de la orden o referencia</label><input type="file" id="orderFile" accept="image/*" capture="environment"><input type="hidden" name="foto"></div><div class="full actions"><button class="btn primary" type="submit">Guardar</button><button class="btn light" type="button" onclick="closeModal('orderModal')">Cancelar</button></div></form></div></div>
<div id="expenseModal" class="modal"><div class="panel"><h2>Nuevo gasto</h2><div id="expenseError" class="error"></div><form id="expenseForm" class="form" onsubmit="submitExpense(event)"><div><label>Fecha</label><input type="date" name="fecha" required></div><div><label>Cantidad</label><input type="number" step="0.01" min="0.01" name="cantidad" required></div><div><label>Categoría</label><select name="categoria"><option>Productos</option><option>Materiales</option><option>Tinta</option><option>Papel</option><option>Empaque</option><option>Envíos</option><option>Publicidad</option><option>Suscripciones</option><option>Equipos</option><option>Otro</option></select></div><div><label>Lugar</label><input name="lugar"></div><div class="full"><label>Nota</label><textarea name="nota"></textarea></div><div class="full"><label>Foto del recibo</label><input type="file" id="receiptFile" accept="image/*" capture="environment"><input type="hidden" name="recibo"></div><div class="full actions"><button class="btn primary">Guardar gasto</button><button class="btn light" type="button" onclick="closeModal('expenseModal')">Cancelar</button></div></form></div></div>
<div id="productModal" class="modal"><div class="panel"><h2 id="productTitle">Nuevo producto</h2><div id="productError" class="error"></div><form id="productForm" class="form" onsubmit="submitProduct(event)"><input type="hidden" name="id"><input type="hidden" name="creadoEn"><div class="full"><label>Nombre</label><input name="nombre" required></div><div><label>Disponible</label><select name="disponible"><option value="true">Sí</option><option value="false">No</option></select></div><div><label>Foto</label><input type="file" id="productImage" accept="image/*"><input type="hidden" name="foto"></div><div class="full actions"><button class="btn primary">Guardar producto</button><button class="btn light" type="button" onclick="closeModal('productModal')">Cancelar</button></div></form></div></div>
<script>
let data={orders:[],expenses:[],products:[],settings:{tiktokDays:2,printaDays:3},summary:{}};let orderFilter='Pendiente';const $=s=>document.querySelector(s),money=v=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(v||0));
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function load(){document.body.classList.add('loading');google.script.run.withSuccessHandler(d=>{data=d;render();document.body.classList.remove('loading')}).withFailureHandler(showGlobalError).getAppData()}
function render(){renderMetrics();renderOrders();renderPreview();renderExpenses();renderProducts();renderProductSelect()}
function renderMetrics(){const s=data.summary||{};$('#metrics').innerHTML=[['Pendientes',s.pendientes],['Listas',s.listos],['Ingresos',money(s.ingresos)],['Gastos',money(s.gastos)],['Ganancia',money(s.ganancia)]].map(x=>`<div class="card metric"><small>${x[0]}</small><strong>${x[1]??0}</strong></div>`).join('');$('#financeMetrics').innerHTML=[['Ingresos',money(s.ingresos)],['Gastos',money(s.gastos)],['Ganancia',money(s.ganancia)],['TikTok',money(s.tiktok)],['Printa Crea',money(s.printaCrea)]].map(x=>`<div class="card metric"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}
function card(o){return `<div class="card"><span class="badge ${o.estado==='Listo'?'ready':''}">${esc(o.estado)}</span><h3>${esc(o.id)} · ${esc(o.origen)}</h3><p><b>${esc(o.cliente)}</b> — ${esc(o.producto)} × ${esc(o.cantidad)}</p><p>Pagado: <b>${money(o.pagado)}</b></p><p>Enviar antes del: <b>${esc(o.fechaEnvio||'')}</b></p>${o.notas?`<p>${esc(o.notas)}</p>`:''}${o.foto?`<p><a href="${o.foto}" target="_blank">Ver foto</a></p>`:''}<div class="actions"><button class="btn good" onclick="toggleStatus('${o.id}','${o.estado==='Listo'?'Pendiente':'Listo'}')">${o.estado==='Listo'?'Regresar a pendiente':'Marcar listo'}</button><button class="btn light" onclick="editOrder('${o.id}')">Editar</button><button class="btn danger" onclick="removeOrder('${o.id}')">Eliminar</button></div></div>`}
function renderOrders(){const rows=data.orders.filter(o=>orderFilter==='Todos'||o.estado===orderFilter).reverse();$('#ordersList').innerHTML=rows.length?rows.map(card).join(''):'<div class="card empty">No hay órdenes.</div>'}
function renderPreview(){const rows=data.orders.filter(o=>o.estado==='Pendiente').slice(-4).reverse();$('#pendingPreview').innerHTML=rows.length?rows.map(card).join(''):'<div class="card empty">No hay órdenes pendientes.</div>'}
function renderExpenses(){const rows=[...data.expenses].reverse();$('#expensesList').innerHTML=rows.length?rows.map(e=>`<div class="card" style="margin-bottom:10px"><b>${esc(e.categoria)}</b> · ${money(e.cantidad)}<p>${esc(e.nota||'')}</p><div class="actions">${e.recibo?`<a class="btn light" href="${e.recibo}" target="_blank">Ver recibo</a>`:''}<button class="btn danger" onclick="removeExpense('${e.id}')">Eliminar</button></div></div>`).join(''):'<div class="card empty">No hay gastos.</div>'}
function renderProducts(){const rows=[...data.products].reverse();$('#productsList').innerHTML=rows.length?rows.map(p=>`<div class="card"><div style="display:flex;gap:12px;align-items:center">${p.foto?`<img class="product-img" src="${p.foto}">`:''}<div><h3>${esc(p.nombre)}</h3><span class="badge ${String(p.disponible).toLowerCase()==='true'?'ready':''}">${String(p.disponible).toLowerCase()==='true'?'Disponible':'No disponible'}</span></div></div><div class="actions" style="margin-top:12px"><button class="btn light" onclick="editProduct('${p.id}')">Editar</button><button class="btn danger" onclick="removeProduct('${p.id}')">Eliminar</button></div></div>`).join(''):'<div class="card empty">No hay productos.</div>'}
function renderProductSelect(){const rows=data.products.filter(p=>String(p.disponible).toLowerCase()==='true');$('#productSelect').innerHTML=rows.length?rows.map(p=>`<option>${esc(p.nombre)}</option>`).join(''):'<option value="">Agrega un producto primero</option>'}
function addBusinessDays(dateString,days){const [y,m,d]=dateString.split('-').map(Number),date=new Date(y,m-1,d,12);let n=0;while(n<days){date.setDate(date.getDate()+1);if(date.getDay()!==0&&date.getDay()!==6)n++}return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`}
function updateShippingDate(){const f=$('#orderForm'),origin=f.origen.value,days=origin==='TikTok'?Number(data.settings.tiktokDays||2):Number(data.settings.printaDays||3);f.fechaEnvio.value=addBusinessDays(f.fecha.value||today(),days);$('#shippingHint').textContent=`Se calcula automáticamente: ${days} días laborables para ${origin==='TikTok'?'TikTok Shop':'Printa Crea'}.`}
function openOrder(){const f=$('#orderForm');f.reset();f.fecha.value=today();f.cantidad.value=1;f.pagado.value=0;$('#orderTitle').textContent='Nueva orden';renderProductSelect();updateShippingDate();showModal('orderModal')}
function editOrder(id){const o=data.orders.find(x=>x.id===id);if(!o)return;openOrder();$('#orderTitle').textContent='Editar orden '+id;Object.keys(o).forEach(k=>{if($('#orderForm')[k])$('#orderForm')[k].value=o[k]||''});updateShippingDate()}
function openExpense(){const f=$('#expenseForm');f.reset();f.fecha.value=today();showModal('expenseModal')}
function openProduct(){const f=$('#productForm');f.reset();$('#productTitle').textContent='Nuevo producto';showModal('productModal')}
function editProduct(id){const p=data.products.find(x=>x.id===id);if(!p)return;openProduct();$('#productTitle').textContent='Editar producto';Object.keys(p).forEach(k=>{if($('#productForm')[k])$('#productForm')[k].value=p[k]||''})}
function showTab(id,btn){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));$('#'+id).classList.add('active');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active')}
function showModal(id){$('#'+id).classList.add('show')}function closeModal(id){$('#'+id).classList.remove('show')}
async function submitOrder(e){e.preventDefault();const f=e.target;setBusy(f,true);try{const obj=Object.fromEntries(new FormData(f).entries());obj.foto=await uploadOne($('#orderFile').files[0],obj.id||'NUEVA','orden',obj.foto);google.script.run.withSuccessHandler(done('orderModal',f)).withFailureHandler(fail('orderError',f)).saveOrder(obj)}catch(err){showError('orderError',err);setBusy(f,false)}}
async function submitExpense(e){e.preventDefault();const f=e.target;setBusy(f,true);try{const obj=Object.fromEntries(new FormData(f).entries());obj.recibo=await uploadOne($('#receiptFile').files[0],'GASTO','recibo',obj.recibo);google.script.run.withSuccessHandler(done('expenseModal',f)).withFailureHandler(fail('expenseError',f)).saveExpense(obj)}catch(err){showError('expenseError',err);setBusy(f,false)}}
async function submitProduct(e){e.preventDefault();const f=e.target;setBusy(f,true);try{const obj=Object.fromEntries(new FormData(f).entries());obj.foto=await uploadOne($('#productImage').files[0],obj.id||'PRODUCTO','producto',obj.foto);google.script.run.withSuccessHandler(done('productModal',f)).withFailureHandler(fail('productError',f)).saveProduct(obj)}catch(err){showError('productError',err);setBusy(f,false)}}
function done(modal,f){return d=>{data=d;render();closeModal(modal);setBusy(f,false)}}function fail(id,f){return e=>{showError(id,e);setBusy(f,false)}}
function uploadOne(file,id,cat,old){if(!file)return Promise.resolve(old||'');return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).uploadFile(r.result,file.name,file.type,id,cat);r.onerror=reject;r.readAsDataURL(file)})}
function toggleStatus(id,status){google.script.run.withSuccessHandler(d=>{data=d;render()}).withFailureHandler(showGlobalError).setOrderStatus(id,status)}
function removeOrder(id){if(confirm('¿Eliminar esta orden?'))google.script.run.withSuccessHandler(d=>{data=d;render()}).deleteOrder(id)}function removeExpense(id){if(confirm('¿Eliminar este gasto?'))google.script.run.withSuccessHandler(d=>{data=d;render()}).deleteExpense(id)}function removeProduct(id){if(confirm('¿Eliminar este producto?'))google.script.run.withSuccessHandler(d=>{data=d;render()}).deleteProduct(id)}
function setBusy(f,v){f.querySelectorAll('button,input,select,textarea').forEach(x=>x.disabled=v)}function showError(id,e){const x=$('#'+id);x.textContent=e.message||e;x.style.display='block'}function showGlobalError(e){alert(e.message||e)}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
load();
</script>
</body>
</html>
