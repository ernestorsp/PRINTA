<!DOCTYPE html><html lang="es"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{--bg:#f6f7fb;--card:#fff;--ink:#18181b;--muted:#71717a;--accent:#111827;--green:#15803d;--red:#b91c1c;--line:#e4e4e7}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}.wrap{max-width:1100px;margin:auto;padding:18px}.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}.tabs button,.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer}.tabs button{background:#e4e4e7}.tabs button.active,.btn.primary{background:var(--accent);color:#fff}.btn.good{background:#dcfce7;color:#166534}.btn.danger{background:#fee2e2;color:#991b1b}.btn.light{background:#f4f4f5}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px}.metric small{color:var(--muted)}.metric strong{display:block;font-size:24px;margin-top:5px}.section{display:none}.section.active{display:block}.toolbar{display:flex;justify-content:space-between;gap:10px;margin:18px 0;flex-wrap:wrap}.orders,.products{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.order h3,.product h3{margin:8px 0}.order p,.product p{margin:5px 0;color:#3f3f46}.badge{display:inline-block;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700}.pending{background:#fef3c7;color:#92400e}.ready{background:#dcfce7;color:#166534}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modal.show{display:flex}.panel{background:#fff;border-radius:16px;padding:20px;width:min(720px,100%);max-height:92vh;overflow:auto}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{font-size:13px;font-weight:700;display:block;margin-bottom:5px}input,select,textarea{width:100%;padding:11px;border:1px solid #d4d4d8;border-radius:9px;font:inherit}textarea{min-height:100px}.empty{text-align:center;color:var(--muted);padding:32px}.thumb{width:100%;height:170px;object-fit:cover;border-radius:10px;background:#eee}.error{background:#fee2e2;color:#991b1b;padding:10px;border-radius:8px;margin-bottom:10px;display:none}.loading{opacity:.55;pointer-events:none}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.orders,.products,.form{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header><h1>PRINTA</h1><button class="btn primary" onclick="openOrder()">+ Nueva orden</button></header><div class="wrap"><div class="tabs"><button class="active" onclick="showTab('inicio',this)">Inicio</button><button onclick="showTab('ordenes',this)">Órdenes</button><button onclick="showTab('productos',this)">Productos</button><button onclick="showTab('finanzas',this)">Finanzas</button></div><section id="inicio" class="section active"><div class="grid" id="metrics"></div><div class="toolbar"><h2>Órdenes pendientes</h2></div><div class="orders" id="pendingPreview"></div></section><section id="ordenes" class="section"><div class="toolbar"><div><button class="btn light" onclick="orderFilter='Pendiente';renderOrders()">Pendientes</button> <button class="btn light" onclick="orderFilter='Listo';renderOrders()">Listas</button> <button class="btn light" onclick="orderFilter='Todos';renderOrders()">Todas</button></div><button class="btn primary" onclick="openOrder()">+ Nueva orden</button></div><div class="orders" id="ordersList"></div></section><section id="productos" class="section"><div class="toolbar"><h2>Productos disponibles</h2><button class="btn primary" onclick="openProduct()">+ Agregar producto</button></div><div class="products" id="productsList"></div></section><section id="finanzas" class="section"><div class="grid" id="financeMetrics"></div><div class="toolbar"><h2>Gastos</h2><button class="btn primary" onclick="openExpense()">+ Nuevo gasto</button></div><div id="expensesList"></div></section></div><div id="orderModal" class="modal"><div class="panel"><h2 id="orderTitle">Nueva orden</h2><div id="orderError" class="error"></div><form id="orderForm" class="form" onsubmit="submitOrder(event)"><input type="hidden" name="id"><input type="hidden" name="creadoEn"><input type="hidden" name="foto"><div><label>Fecha</label><input type="date" name="fecha" required></div><div><label>Origen</label><select name="origen"><option>TikTok</option><option>Printa Crea</option><option>Otro</option></select></div><div><label>Cliente</label><input name="cliente" required></div><div><label>Producto</label><select name="producto" id="productSelect" required></select></div><div><label>Cantidad</label><input type="number" min="1" name="cantidad" value="1"></div><div><label>Fecha límite de envío</label><input type="date" name="fechaEnvio"></div><div class="full"><label>Precio pagado</label><input type="number" step="0.01" min="0" name="pagado" value="0"></div><div class="full"><label>Notas</label><textarea name="notas"></textarea></div><div class="full"><label>Foto de la orden o referencia</label><input type="file" id="orderFile" accept="image/*" capture="environment"></div><div class="full actions"><button class="btn primary" type="submit">Guardar</button><button class="btn light" type="button" onclick="closeModal('orderModal')">Cancelar</button></div></form></div></div><div id="productModal" class="modal"><div class="panel"><h2 id="productTitle">Agregar producto</h2><div id="productError" class="error"></div><form id="productForm" class="form" onsubmit="submitProduct(event)"><input type="hidden" name="id"><input type="hidden" name="creadoEn"><input type="hidden" name="foto"><div class="full"><label>Nombre del producto</label><input name="nombre" required placeholder="Ej. Tumbler 20oz con tapa"></div><div><label>Disponible</label><select name="disponible"><option value="true">Sí</option><option value="false">No</option></select></div><div><label>Foto</label><input type="file" id="catalogFile" accept="image/*" capture="environment"></div><div class="full actions"><button class="btn primary" type="submit">Guardar producto</button><button class="btn light" type="button" onclick="closeModal('productModal')">Cancelar</button></div></form></div></div><div id="expenseModal" class="modal"><div class="panel"><h2>Nuevo gasto</h2><div id="expenseError" class="error"></div><form id="expenseForm" class="form" onsubmit="submitExpense(event)"><div><label>Fecha</label><input type="date" name="fecha" required></div><div><label>Cantidad</label><input type="number" step="0.01" min="0.01" name="cantidad" required></div><div><label>Categoría</label><select name="categoria"><option>Productos</option><option>Materiales</option><option>Tinta</option><option>Papel</option><option>Empaque</option><option>Envíos</option><option>Publicidad</option><option>Suscripciones</option><option>Equipos</option><option>Otro</option></select></div><div><label>Lugar</label><input name="lugar"></div><div class="full"><label>Nota</label><textarea name="nota"></textarea></div><div class="full"><label>Foto del recibo</label><input type="file" id="receiptFile" accept="image/*" capture="environment"><input type="hidden" name="recibo"></div><div class="full actions"><button class="btn primary" type="submit">Guardar gasto</button><button class="btn light" type="button" onclick="closeModal('expenseModal')">Cancelar</button></div></form></div></div><script>let data={orders:[],expenses:[],products:[],summary:{}};let orderFilter='Pendiente';const $=s=>document.querySelector(s),money=v=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(v||0));function today(){return new Date().toISOString().slice(0,10)}function load(){document.body.classList.add('loading');google.script.run.withSuccessHandler(d=>{data=d;render();document.body.classList.remove('loading')}).withFailureHandler(showGlobalError).getAppData()}function render(){renderMetrics();renderProducts();renderProductSelect();renderOrders();renderExpenses();renderPreview()}function renderMetrics(){const s=data.summary||{};$('#metrics').innerHTML=[['Pendientes',s.pendientes],['Listas',s.listos],['Ingresos',money(s.ingresos)],['Gastos',money(s.gastos)],['Ganancia',money(s.ganancia)]].map(x=>`<div class="card metric"><small>${x[0]}</small><strong>${x[1]??0}</strong></div>`).join('');$('#financeMetrics').innerHTML=[['Ingresos',money(s.ingresos)],['Gastos',money(s.gastos)],['Ganancia',money(s.ganancia)],['TikTok',money(s.tiktok)],['Printa Crea',money(s.printaCrea)]].map(x=>`<div class="card metric"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}function renderProductSelect(){const p=data.products.filter(x=>String(x.disponible).toLowerCase()!=='false');$('#productSelect').innerHTML=p.length?p.map(x=>`<option>${esc(x.nombre)}</option>`).join(''):'<option value="">Agrega un producto primero</option>'}function renderProducts(){const p=[...data.products].reverse();$('#productsList').innerHTML=p.length?p.map(x=>`<div class="card product">${x.foto?`<img class="thumb" src="${x.foto}">`:''}<h3>${esc(x.nombre)}</h3><p>${String(x.disponible).toLowerCase()==='false'?'No disponible':'Disponible'}</p><div class="actions"><button class="btn light" onclick="editProduct('${x.id}')">Editar</button><button class="btn danger" onclick="removeProduct('${x.id}')">Eliminar</button></div></div>`).join(''):'<div class="card empty">No hay productos.</div>'}function card(o){return`<div class="card order">${o.foto?`<img class="thumb" src="${o.foto}">`:''}<span class="badge ${o.estado==='Listo'?'ready':'pending'}">${o.estado}</span><h3>${esc(o.id)} · ${esc(o.origen)}</h3><p><b>${esc(o.cliente)}</b> — ${esc(o.producto)} × ${esc(o.cantidad)}</p><p>Pagado: <b>${money(o.pagado)}</b></p><p>Enviar antes de: <b>${esc(o.fechaEnvio||'Sin fecha')}</b></p><p>${esc(o.notas||'Sin notas')}</p><div class="actions"><button class="btn good" onclick="toggleStatus('${o.id}','${o.estado==='Listo'?'Pendiente':'Listo'}')">${o.estado==='Listo'?'Regresar a pendiente':'Marcar listo'}</button><button class="btn light" onclick="editOrder('${o.id}')">Editar</button><button class="btn danger" onclick="removeOrder('${o.id}')">Eliminar</button></div></div>`}function renderOrders(){const r=data.orders.filter(o=>orderFilter==='Todos'||o.estado===orderFilter).reverse();$('#ordersList').innerHTML=r.length?r.map(card).join(''):'<div class="card empty">No hay órdenes.</div>'}function renderPreview(){const r=data.orders.filter(o=>o.estado==='Pendiente').slice(-4).reverse();$('#pendingPreview').innerHTML=r.length?r.map(card).join(''):'<div class="card empty">No hay órdenes pendientes.</div>'}function renderExpenses(){const r=[...data.expenses].reverse();$('#expensesList').innerHTML=r.length?r.map(e=>`<div class="card" style="margin-bottom:10px"><b>${esc(e.categoria)}</b> · ${money(e.cantidad)}<br><small>${esc(e.fecha)} · ${esc(e.lugar||'')}</small><p>${esc(e.nota||'')}</p><div class="actions">${e.recibo?`<a class="btn light" href="${e.recibo}" target="_blank">Ver recibo</a>`:''}<button class="btn danger" onclick="removeExpense('${e.id}')">Eliminar</button></div></div>`).join(''):'<div class="card empty">No hay gastos.</div>'}function showTab(id,b){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));$('#'+id).classList.add('active');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active')}function openOrder(){const f=$('#orderForm');f.reset();f.fecha.value=today();f.cantidad.value=1;f.pagado.value=0;$('#orderTitle').textContent='Nueva orden';showModal('orderModal')}function editOrder(id){const o=data.orders.find(x=>x.id===id);if(!o)return;openOrder();$('#orderTitle').textContent='Editar orden '+id;Object.keys(o).forEach(k=>{if($('#orderForm')[k])$('#orderForm')[k].value=o[k]||''})}function openProduct(){const f=$('#productForm');f.reset();f.disponible.value='true';$('#productTitle').textContent='Agregar producto';showModal('productModal')}function editProduct(id){const p=data.products.find(x=>x.id===id);if(!p)return;openProduct();$('#productTitle').textContent='Editar producto';Object.keys(p).forEach(k=>{if($('#productForm')[k])$('#productForm')[k].value=p[k]||''})}function openExpense(){const f=$('#expenseForm');f.reset();f.fecha.value=today();showModal('expenseModal')}function showModal(id){$('#'+id).classList.add('show')}function closeModal(id){$('#'+id).classList.remove('show')}async function submitOrder(e){e.preventDefault();const f=e.target;busy(f,true);try{const o=Object.fromEntries(new FormData(f).entries());o.foto=await uploadOne($('#orderFile').files[0],o.id||'NUEVA','orden',o.foto);run('saveOrder',o,d=>{data=d;render();closeModal('orderModal');busy(f,false)},err=>fail('orderError',err,f))}catch(err){fail('orderError',err,f)}}async function submitProduct(e){e.preventDefault();const f=e.target;busy(f,true);try{const p=Object.fromEntries(new FormData(f).entries());p.foto=await uploadOne($('#catalogFile').files[0],p.id||'PRODUCTO','catalogo',p.foto);run('saveProduct',p,d=>{data=d;render();closeModal('productModal');busy(f,false)},err=>fail('productError',err,f))}catch(err){fail('productError',err,f)}}async function submitExpense(e){e.preventDefault();const f=e.target;busy(f,true);try{const o=Object.fromEntries(new FormData(f).entries());o.recibo=await uploadOne($('#receiptFile').files[0],'GASTO','recibo',o.recibo);run('saveExpense',o,d=>{data=d;render();closeModal('expenseModal');busy(f,false)},err=>fail('expenseError',err,f))}catch(err){fail('expenseError',err,f)}}function run(fn,arg,ok,er){google.script.run.withSuccessHandler(ok).withFailureHandler(er)[fn](arg)}function uploadOne(file,id,cat,old){if(!file)return Promise.resolve(old||'');return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>google.script.run.withSuccessHandler(res).withFailureHandler(rej).uploadFile(r.result,file.name,file.type,id,cat);r.onerror=rej;r.readAsDataURL(file)})}function toggleStatus(id,s){google.script.run.withSuccessHandler(d=>{data=d;render()}).withFailureHandler(showGlobalError).setOrderStatus(id,s)}function removeOrder(id){if(confirm('¿Eliminar esta orden?'))google.script.run.withSuccessHandler(d=>{data=d;render()}).deleteOrder(id)}function removeProduct(id){if(confirm('¿Eliminar este producto?'))google.script.run.withSuccessHandler(d=>{data=d;render()}).deleteProduct(id)}function removeExpense(id){if(confirm('¿Eliminar este gasto?'))google.script.run.withSuccessHandler(d=>{data=d;render()}).deleteExpense(id)}function busy(f,v){f.classList.toggle('loading',v)}function fail(id,e,f){const x=$('#'+id);x.textContent=e.message||e;x.style.display='block';busy(f,false)}function showGlobalError(e){alert(e.message||e);document.body.classList.remove('loading')}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}load();</script></body></html>
